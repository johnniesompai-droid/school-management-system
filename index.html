*{box-sizing:border-box}body{margin:0;font-family:'Kanit',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
svg{width:18px;height:18px;flex-shrink:0}
.app{display:flex;min-height:100vh;min-height:100dvh}
aside{width:232px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;flex-shrink:0;z-index:20;transition:transform .2s}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 16px}.brand img{width:44px;height:44px;border-radius:50%}
.brand b{display:block;font-size:.95rem;line-height:1.2}.brand small{color:var(--mute);font-size:.66rem;line-height:1.2;display:block}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:2px;border-radius:10px;color:#3B4763;cursor:pointer;font-size:.85rem}
.nav a:hover{background:var(--soft)}.nav a.on{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.35)}
.nav .ch{margin-left:auto;width:14px;height:14px;opacity:.5;transition:transform .15s}.op .ch{transform:rotate(90deg)}
.sub{display:none;padding-left:24px}.sub.open{display:block}.sub a{font-size:.78rem;padding:7px 10px}
.nav h6{margin:18px 12px 6px;font-size:.7rem;color:var(--mute);font-weight:500}
.tag{margin:26px 12px 0;color:var(--blue);font-weight:600;font-size:.82rem;line-height:1.3}
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.top>svg,.ico svg{width:20px;height:20px}
.search{position:relative;flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:9px 14px;color:var(--mute)}
.search input{border:0;background:none;outline:0;flex:1;font:inherit;min-width:0}
#searchResults{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);max-height:340px;overflow-y:auto;z-index:50;text-align:left}
.sres{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--text)}
.sres:last-child{border-bottom:none}.sres:hover{background:var(--soft)}
.sres small{display:block;color:var(--mute);font-size:.72rem;margin-top:2px}
.chip{margin-left:auto;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.8rem}
.ico{color:#55607A;cursor:pointer;position:relative}.bell-badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:.6rem;line-height:1.5;border-radius:9px;padding:0 5px;font-style:normal}.user{display:flex;gap:10px;align-items:center;line-height:1.2}.user small{display:block;color:var(--mute);font-size:.7rem}
.av{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--blue)}
#view{padding:20px;display:grid;gap:16px}
.grid{display:grid;gap:16px}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr) 300px}
.card{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:16px}.card .card{box-shadow:none;border:1px solid var(--line)}
.card h3{margin:0 0 12px;font-size:.92rem;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.card h3 a{font-size:.72rem;color:var(--blue);font-weight:400;cursor:pointer}
.empty{border:1.5px dashed var(--line);border-radius:10px;color:#A3ADC0;font-size:.78rem;display:grid;place-items:center;min-height:130px;text-align:center;padding:10px}
.bx{width:48px;height:48px;border-radius:12px;color:#fff;display:grid;place-items:center}.bx svg{width:24px;height:24px}
.stat{display:flex;gap:12px;align-items:center}.stat small{color:var(--mute);font-size:.75rem}.stat b{font-size:1.5rem;display:block;line-height:1.3}
.hero{border-radius:14px;overflow:hidden;aspect-ratio:3/1;max-height:280px;width:100%;background:#4a2e6b var(--hero) center 20%/cover;animation:rise .9s both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.pt h2{margin:0;font-size:1.3rem}.pt p{margin:2px 0 0;color:var(--mute);font-size:.8rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.75rem;gap:4px}.cal span{padding:5px 0;border-radius:50%}.cal .today{background:var(--blue);color:#fff}
.dv{cursor:pointer;border:2px solid transparent}.dv:hover,.dv.sel{border-color:var(--blue)}.dv h4{margin:12px 0 6px;font-size:.92rem}.dv span{color:var(--blue);font-size:.75rem}
.oc{display:flex;flex-direction:column;align-items:center;overflow-x:auto}
.node{background:var(--soft);color:#1F3F99;border-radius:12px;padding:12px 16px;font-weight:500;text-align:center;font-size:.85rem}.node.dark{background:var(--blue);color:#fff}
.vl{width:2px;height:24px;background:#C9D4E8}
.brn{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%;min-width:720px;position:relative;padding-top:24px}
.brn:before{content:"";position:absolute;top:0;left:12.5%;right:12.5%;border-top:2px solid #C9D4E8}
.brn>div{position:relative}.brn>div:before{content:"";position:absolute;top:-24px;left:50%;height:24px;border-left:2px solid #C9D4E8}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:14px 20px 22px;color:var(--mute);font-size:.72rem}
@media(min-width:901px){.hide aside{display:none}}
@media(max-width:900px){aside{position:fixed;left:0;top:0;height:100vh;height:100dvh;transform:translateX(-100%)}aside.show{transform:none;box-shadow:var(--sh)}.g6,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.split{grid-template-columns:1fr}}
@media(max-width:560px){.g6,.g4,.g2{grid-template-columns:1fr}.user span,.chip{display:none}.hero{aspect-ratio:2/1;background-position:75% 20%}}
@media(prefers-reduced-motion:reduce){.hero{animation:none}}

.svh-s{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;min-width:0}
.svs{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);min-width:0}
.svs-i{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.svs-i svg{width:26px;height:26px}
.svs small{display:block;font-size:.76rem;color:#3D4A6B;font-weight:500}.svs b{display:block;font-size:1.45rem;line-height:1.25;color:#1F2A5C}.svs em{display:block;font-style:normal;font-size:.7rem;color:var(--mute)}
.svs:last-child b{color:#1E8E4E}
.svsec{margin-bottom:16px}.svsec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.svsec-h h3{margin:0;display:flex;align-items:center;gap:8px;font-size:1.2rem}.svsec-h h3 svg{width:24px;height:24px;color:#2F6BFF}
.svpill{margin-left:auto;background:#EEF3FD;border-radius:20px;padding:6px 16px;font-size:.8rem;color:#3D4A6B}.svpill b{color:#2F6BFF}.svpill b.bl{color:#1F3F99}.svpill i{font-style:normal;margin:0 6px;color:#B8C2D8}
.svcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}
.svc{position:relative;background:#fff;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s;min-width:0}
.svc:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,42,68,.12)}
.svc h4{margin:0 0 10px;padding-left:8px;border-left:4px solid var(--c);font-size:1rem;color:#1F2A5C;line-height:1.2}
.svc-b{display:flex;align-items:center;gap:8px}.svc-i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}.svc-i svg{width:17px;height:17px}
.svc-n b,.svc-m b,.svc-n small,.svc-m small{white-space:nowrap}.svc-n b,.svc-m b{display:block;font-size:1rem;color:#1F2A5C;line-height:1.2}.svc-n small,.svc-m small{display:block;font-size:.7rem;color:var(--mute)}
.svc-sp{width:1px;height:30px;background:var(--line);margin:0 4px}.svc-ar{position:absolute;right:12px;top:14px;color:#6B7794;font-size:1.2rem;line-height:1}

.sts{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,#fff),#fff);border:1px solid color-mix(in srgb,var(--c) 22%,#fff);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);min-width:0}
.sts-i{width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}.sts-i svg{width:26px;height:26px}
.sts small{display:block;font-size:.84rem;color:#1F2A5C;font-weight:500}.sts b{display:block;font-size:1.6rem;line-height:1.2;color:var(--c)}.sts-ar{margin-left:auto;color:#6B7794;font-size:1.3rem}
.stsec{margin-bottom:18px}.stsec h3{display:flex;align-items:center;gap:10px;font-size:1.25rem;color:#1F2A5C;margin:0 0 12px}.stsec h3 svg{width:26px;height:26px;color:#2F6BFF}
.stcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.stc{background:#fff;border-radius:12px;border-top:4px solid var(--c);padding:14px 16px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s;min-width:0}
.stc:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,42,68,.12)}
.stc h4{margin:0 0 12px;font-size:1.05rem;color:#1F2A5C;padding-bottom:12px;border-bottom:1px solid var(--line)}
.stc-r{display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:12px;border-bottom:1px solid var(--line)}
.stc-c{display:flex;align-items:center;gap:6px;padding:0 4px 0 8px;min-width:0;border-left:1px solid var(--line)}.stc-c:first-child{border-left:0;padding-left:0}
.stc-ci svg{width:20px;height:20px}.stc-c small{display:block;font-size:.72rem;color:var(--mute);line-height:1.1}.stc-c b{display:block;font-size:.95rem;color:#1F3F99;white-space:nowrap;line-height:1.3}
.stc-t{padding-top:10px}.stc-t>small{display:block;font-size:.72rem;color:var(--mute);margin-bottom:6px}
.stc-p{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:.88rem;color:#1F2A5C}.stc-p img,.stc-av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#E6EBF3;color:#8793AD;display:flex;align-items:center;justify-content:center}.stc-av svg{width:20px;height:20px}
.stsum{display:flex;flex-wrap:wrap;gap:10px;margin:-4px 0 14px}.stsum span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 16px;font-size:.85rem;color:#3D4A6B;box-shadow:var(--sh)}.stsum b{font-size:1rem}.stsum .m b{color:#2F6BFF}.stsum .f b{color:#F0529C}.stsum .t b{color:#1F3F99}
</style></head><body>

</div></div>`};
document.addEventListener('click',async e=>{const a=e.target.closest('[data-sd]');if(!a||!me)return;const idx=+a.dataset.sd,s=ST.find(x=>x.id==stEd);if(!s||!confirm('ลบไฟล์นี้?'))return;
const d=s.docs[idx];try{await storage.ref(d.path).delete().catch(()=>{});const docs=s.docs.filter((_,i)=>i!=idx);await db.collection('students').doc(stEd).set({docs},{merge:true});s.docs=docs;$('#stdocs').innerHTML=docsBlock(s)}catch(err){alert('ลบไม่สำเร็จ: '+err.message)}});
V.stu=()=>PT('นักเรียน & ผู้ปกครอง','เลือกหัวข้อที่ต้องการ')+`<div class="grid g4"><div class="card dv" data-r="stud"><div class="bx" style="background:#2F6BFF">${ic('cap')}</div><h4>นักเรียน</h4><span>เปิดดู ›</span></div><div class="card dv" data-r="par"><div class="bx" style="background:#22B573">${ic('users')}</div><h4>ผู้ปกครอง</h4><span>เปิดดู ›</span></div></div>`;
const ST_COL=['#F472B6','#2BB5A0','#5B8DEF','#F5B52E','#5CB85C','#A06CF0','#4C9BF0','#F59A3A'];
function studPicker(){const M=ST.filter(x=>gd(x.tt)=='m').length,F=ST.filter(x=>gd(x.tt)=='f').length;
const stat=(c,ico,l,v)=>`<div class="sts" style="--c:${c}"><span class="sts-i">${ic(ico)}</span><div><small>${l}</small><b>${v} คน</b></div><span class="sts-ar">›</span></div>`;
const card=(t,i)=>{const cs=ST.filter(x=>x.ty==t&&x.lv==i),m=cs.filter(x=>gd(x.tt)=='m').length,f=cs.filter(x=>gd(x.tt)=='f').length,k=t+i,c=ST_COL[i%8],
ts=(HR[k]||[]).map(id=>PP.find(p=>p.id==id)).filter(Boolean),
col=(ico,cl,l,v)=>`<div class="stc-c"><span class="stc-ci" style="color:${cl}">${ic(ico)}</span><div><small>${l}</small><b>${v} คน</b></div></div>`;
return `<div class="stc" style="--c:${c}" data-r="stud:${k}"><h4>${esc(LV[i].replace(/^ชั้น/,'').trim())}</h4>
<div class="stc-r">${col('user','#2F6BFF','ชาย',m)}${col('user','#F0529C','หญิง',f)}${col('users','#4B5A8C','รวม',cs.length)}</div>
<div class="stc-t"><small>ครูประจำชั้น</small>${ts.length?ts.map(p=>`<div class="stc-p">${p.im?`<img src="${p.im}">`:`<span class="stc-av">${ic('user')}</span>`}<span>${esc(dn(p))}</span></div>`).join(''):'<div class="stc-p" style="color:var(--mute)"><span class="stc-av">'+ic('user')+'</span><span>ยังไม่ได้เลือกครูประจำชั้น</span></div>'}</div></div>`};
return `<div class="svh"><div class="svh-t"><span class="svh-i">${ic('users')}</span><div><h2>นักเรียน</h2><p>ข้อมูลนักเรียนแยกตามห้องเรียน</p></div></div>
<div class="svh-s">${stat('#2F6BFF','users','นักเรียนทั้งหมด',ST.length)}${stat('#2BB5A0','user','นักเรียนชาย',M)}${stat('#F0529C','user','นักเรียนหญิง',F)}</div></div>`
+Object.keys(CT).map(t=>{const g=ST.filter(x=>x.ty==t),gm=g.filter(x=>gd(x.tt)=='m').length,gf=g.filter(x=>gd(x.tt)=='f').length;return `<div class="stsec"><h3>${ic(t=='m'?'home':'bld')} ${CT[t][0]}</h3><div class="stsum"><span class="m">ชาย <b>${gm}</b> คน</span><span class="f">หญิง <b>${gf}</b> คน</span><span class="t">รวมทั้งหมด <b>${g.length}</b> คน</span></div><div class="stcg ${t=='b'?'b5':''}">${LV.slice(0,CT[t][1]).map((n,i)=>card(t,i)).join('')}</div></div>`}).join('')}
V.stud=s=>s?lvPage(s):studPicker();
V.par=()=>V.gen('ผู้ปกครอง');
document.addEventListener('click',e=>{const a=e.target.closest('[data-s]');if(!a||!me)return;const x=ST.find(t=>t.id==a.dataset.s);if(x&&confirm('ลบรายชื่อนี้?')){(x.docs||[]).forEach(d=>storage.ref(d.path).delete().catch(()=>{}));ST=ST.filter(t=>t!=x);db.collection('students').doc(x.id).delete().catch(()=>{});go('stud:'+x.ty+x.lv)}});
const hrCard=s=>{const ids=HR[s]||[],ts=ids.map(id=>PP.find(p=>p.id==id)).filter(Boolean),av=PP.filter(p=>!ids.includes(p.id));
return P('ครูประจำชั้น',`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">${ts.map(p=>`<span class="pc dp" style="margin:0;display:flex;align-items:center;gap:10px"><span>${esc(dn(p))}<small>${esc(p.po)||'-'}</small></span><button class="btn r" style="padding:2px 9px" data-h="${s}:${p.id}" title="ลบครูประจำชั้น">✕</button></span>`).join('')||'<span style="color:var(--mute);font-size:.8rem">ยังไม่ได้เลือกครูประจำชั้น</span>'}</div>`
+(PP.length?`<select class="in" id="hs" style="max-width:360px;margin:0" onchange="addHr('${s}')"><option value="">+ เลือกครูจากข้อมูลบุคลากร</option>${av.map(p=>`<option value="${p.id}">${esc(dn(p))}${p.po?' · '+esc(p.po):''}</option>`).join('')}</select>`:'<div class="empty" style="min-height:60px">ยังไม่มีข้อมูลบุคลากร กรุณาเพิ่มในเมนูบุคลากรก่อน</div>'))};
function addHr(s){const v=$('#hs').value;if(!v)return;const ids=[...(HR[s]||[]),v];HR[s]=ids;db.collection('homeroom').doc(s).set({ids}).catch(e=>alert('บันทึกไม่สำเร็จ: '+e.message));go('stud:'+s)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-h]');if(!a||!me)return;const[k,id]=a.dataset.h.split(':');if(confirm('เอาครูท่านนี้ออกจากครูประจำชั้น?')){const ids=(HR[k]||[]).filter(x=>x!=id);HR[k]=ids;db.collection('homeroom').doc(k).set({ids}).catch(()=>{});go('stud:'+k)}});
const gd=t=>{t=(t||'').replace(/\s/g,'');return /นางสาว|นาง|หญิง|ด\.ญ\.|น\.ส\./.test(t)?'f':/นาย|ชาย|ด\.ช\.|ว่าที่/.test(t)?'m':''};
const sx=(ts,a,b)=>{const m=ts.filter(t=>gd(t)=='m').length,f=ts.filter(t=>gd(t)=='f').length,u=ts.length-m-f;return `<div class="sx"><span>${a}</span><b>${m} คน</b></div><div class="sx"><span>${b}</span><b>${f} คน</b></div>${u?`<div class="sx"><span>ไม่ระบุเพศ</span><b>${u} คน</b></div>`:''}<div class="sx t"><span>รวม</span><b>${ts.length} คน</b></div>`};
let cy=new Date().getFullYear(),cm=new Date().getMonth(),sel='';
const TM='มกราคม กุมภาพันธ์ มีนาคม เมษายน พฤษภาคม มิถุนายน กรกฎาคม สิงหาคม กันยายน ตุลาคม พฤศจิกายน ธันวาคม'.split(' ');
const upc=()=>{const t=T0(),l=EV.map(e=>({e,n:Math.round((dt(e.d)-t)/864e5)})).filter(x=>x.n>=0&&x.n<=7).sort((a,b)=>a.n-b.n||a.e.d.localeCompare(b.e.d));
return `<div style="font-size:.72rem;color:var(--mute);margin-bottom:4px">กิจกรรมที่ใกล้ถึงวัน (ภายใน 7 วัน)</div>`+(l.length?l.map(x=>`<div class="rw" data-r="cal:${+x.e.d.slice(0,4)}-${+x.e.d.slice(5,7)}" style="cursor:pointer"><span><b>${esc(x.e.t)}</b><small>${th(x.e.d)}</small></span><em style="color:${x.n<=1?'var(--red)':'var(--blue)'};font-weight:500">${x.n==0?'วันนี้':x.n==1?'พรุ่งนี้':'อีก '+x.n+' วัน'}</em></div>`).join(''):E('ไม่มีกิจกรรมที่ใกล้ถึงวัน',80))};
V.cal=s=>{if(s){const a=s.split('-');cy=+a[0];cm=+a[1]-1}
const t=T0(),tk=f2(t.getFullYear(),t.getMonth()+1,t.getDate()),f=new Date(cy,cm,1).getDay(),n=new Date(cy,cm+1,0).getDate(),pv=cm==0?`${cy-1}-12`:`${cy}-${cm}`,nx=cm==11?`${cy+1}-1`:`${cy}-${cm+2}`;
let c='<div></div>'.repeat(f);
for(let i=1;i<=n;i++){const k=f2(cy,cm+1,i),es=EV.filter(e=>e.d==k);c+=`<div class="cd${k==tk?' td':''}${k==sel?' sl':''}" data-c="${k}"><span class="n">${i}</span>${es.slice(0,2).map(e=>`<div class="ep">${esc(e.t)}</div>`).join('')}${es.length>2?`<div class="ep">+${es.length-2} รายการ</div>`:''}</div>`}
let dl=P('กิจกรรม',E('คลิกที่วันในปฏิทินเพื่อดูหรือเพิ่มกิจกรรม',60));
if(sel){const[y,m,d]=sel.split('-'),es=EV.filter(e=>e.d==sel);dl=P(`กิจกรรมวันที่ ${+d} ${TM[+m-1]} ${+y+543}`,`${es.map(e=>`<div class="rw"><span>${esc(e.t)}</span><button class="btn r" data-ev="${e.id}">ลบ</button></div>`).join('')||E('ยังไม่มีกิจกรรมในวันนี้',60)}<div style="display:flex;gap:8px;margin-top:12px"><input class="in" id="et" placeholder="ชื่อกิจกรรม" style="margin:0" onkeydown="if(event.key=='Enter')addEv()"><button class="btn" onclick="addEv()">เพิ่มกิจกรรม</button></div>`)}
return PT('ปฏิทินกิจกรรม','คลิกที่วันเพื่อดูหรือเพิ่มกิจกรรม')+`<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="btn o" data-r="cal:${pv}">‹</button><b style="flex:1;text-align:center;font-size:1.05rem">${TM[cm]} ${cy+543}</b><button class="btn o" data-r="cal:${nx}">›</button><button class="btn" data-r="cal:${t.getFullYear()}-${t.getMonth()+1}">วันนี้</button></div><div class="cg">${'อา จ อ พ พฤ ศ ส'.split(' ').map(x=>`<div class="cw">${x}</div>`).join('')}${c}</div></div>`+dl};
function addEv(){const t=$('#et').value.trim();if(!t||!sel)return;const rec={id:uid(),d:sel,t};EV.push(rec);db.collection('events').doc(rec.id).set(rec).catch(e=>alert('บันทึกไม่สำเร็จ: '+e.message));$('#view').innerHTML=V.cal();$('#et').focus()}
document.addEventListener('click',e=>{if(!me)return;const a=e.target.closest('[data-c]');if(a){sel=a.dataset.c;$('#view').innerHTML=V.cal();return}
const b=e.target.closest('[data-ev]');if(b&&confirm('ลบกิจกรรมนี้?')){EV=EV.filter(x=>x.id!=b.dataset.ev);db.collection('events').doc(b.dataset.ev).delete().catch(()=>{});$('#view').innerHTML=V.cal()}});
let pim='';
function setImg(v){pim=v;const p=$('#pprev');v?p.src=v:p.removeAttribute('src');p.classList.toggle('hid',!v);$('#prm').classList.toggle('hid',!v)}
function pickImg(f){if(!f)return;const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)*.2,s,s,0,0,240,240);setImg(c.toDataURL('image/jpeg',.8))};i.onerror=()=>alert('อ่านไฟล์รูปไม่สำเร็จ');i.src=e.target.result};r.readAsDataURL(f)}
function buildIndex(){const idx=[];
MENU.forEach(m=>idx.push({label:m[1],sub:'เมนู',route:m[0]}));
SYS.forEach(m=>{if(me&&(me.role=='founder'||!['usr','staff'].includes(m[0])))idx.push({label:m[1],sub:'ระบบกลาง',route:m[0]})});
DIV.forEach(d=>idx.push({label:d[1],sub:'งาน 4 ฝ่าย',route:'div:'+d[0]}));
PP.forEach(p=>idx.push({label:dn(p).trim(),sub:'บุคลากร'+(p.po?' · '+p.po:''),route:'profile:'+p.id}));
ST.forEach(s=>idx.push({label:((s.tt||'')+s.fn+' '+s.ln).trim(),sub:'นักเรียน · '+CT[s.ty][0]+' · '+LV[s.lv],route:'stud:'+s.ty+s.lv}));
return idx}
function runSearch(q){const box=$('#searchResults');q=q.trim().toLowerCase();
if(!q){box.style.display='none';box.innerHTML='';return}
const m=buildIndex().filter(x=>x.label.toLowerCase().includes(q)).slice(0,10);
box.innerHTML=m.length?m.map(x=>`<div class="sres" data-r="${x.route}">${esc(x.label)}<small>${esc(x.sub)}</small></div>`).join(''):'<div class="sres" style="color:var(--mute);cursor:default">ไม่พบผลลัพธ์</div>';
box.style.display='block'}
$('#gsearch').addEventListener('input',e=>runSearch(e.target.value));
$('#gsearch').addEventListener('focus',e=>{if(e.target.value)runSearch(e.target.value)});
$('#gsearch').addEventListener('keydown',e=>{if(e.key=='Escape'){e.target.value='';$('#searchResults').style.display='none';e.target.blur()}});
$('#searchResults').addEventListener('click',e=>{if(e.target.closest('.sres[data-r]')){$('#gsearch').value='';$('#searchResults').style.display='none'}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#searchResults').style.display='none'});
(async()=>{try{const cfg=await db.collection('meta').doc('config').get();founderExists=cfg.exists&&!!cfg.data().founderUid}catch(e){}
fbAuth.onAuthStateChanged(async fbUser=>{if(suppress)return;
if(!fbUser){me=null;detachListeners();auth();return}
try{const udoc=await db.collection('users').doc(fbUser.uid).get();
if(!udoc.exists){await fbAuth.signOut();return}
me={_id:fbUser.uid,...udoc.data()};
if(me.st=='pending'){$('#auth').innerHTML=pendingScreen('บัญชีของคุณรอผู้ก่อตั้งอนุมัติ');$('#auth').style.display='grid';return}
if(me.st=='rejected'){$('#auth').innerHTML=pendingScreen('คำขอสมัครของคุณไม่ได้รับการอนุมัติ กรุณาติดต่อผู้ก่อตั้ง');$('#auth').style.display='grid';return}
enter()
}catch(e){alert('เกิดข้อผิดพลาดในการโหลดข้อมูลผู้ใช้: '+e.message)}})})();
